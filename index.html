<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <title>Yi Cui | Economics, Statistics, and Machine Learning</title>
  <meta name="description" content="Yi Cui — research in economics, statistics, causal inference, and machine learning.">

  <!-- Docsify academic profile theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #1f6f8b;
      --sidebar-width: 300px;
    }

    body,
    .sidebar {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .markdown-section {
      max-width: 800px;
      padding: 3.4rem 3.8rem 5rem;
      color: #263238;
      line-height: 1.75;
    }

    .markdown-section h1 {
      margin-top: 0;
      font-size: 2.25rem;
      letter-spacing: -0.03em;
    }

    .markdown-section h2 {
      margin-top: 2.8rem;
      border-bottom: 1px solid #dce3e6;
      padding-bottom: 0.35rem;
    }

    .markdown-section h3 {
      margin-top: 2rem;
    }

    .markdown-section blockquote {
      color: #59636e;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section mjx-container[display="true"] {
      margin: 1.2rem 0 !important;
    }

    .markdown-section .math-display {
      max-width: 100%;
      overflow-x: auto;
    }

    .sidebar {
      border-right: 1px solid #e5eaec;
    }

    .sidebar-nav > ul > li > p {
      color: #526068;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .visitor-map {
      margin-top: 3.5rem;
      padding-top: 0.75rem;
      text-align: center;
    }

    .visitor-map h2 {
      text-align: left;
    }

    .visitor-map-widget {
      margin: 1.25rem auto 0;
      max-width: 640px;
    }

    .article-read-counter {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0.2rem 0 2.2rem;
      color: #66757d;
      font-size: 0.9rem;
    }

    .article-read-counter::before {
      content: "◷";
      color: var(--theme-color);
      font-size: 1rem;
    }

    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 2.2rem 1.4rem 3.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.MathJax = {
      startup: {
        typeset: false
      },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };

    function renderDocsifyMath(attempt) {
      const content = document.querySelector('.markdown-section');
      const sidebar = document.querySelector('.sidebar');

      if (!content || !window.MathJax || !window.MathJax.typesetPromise) {
        if (attempt < 100) window.setTimeout(() => renderDocsifyMath(attempt + 1), 50);
        return;
      }

      const elements = [content, sidebar].filter(Boolean);
      window.MathJax.typesetClear(elements);
      window.MathJax.typesetPromise(elements).catch((error) => console.error('Math rendering failed:', error));
    }

    function escapeLatexForHtml(latex) {
      return latex
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function protectDocsifyMath(markdown) {
      const protectedBlocks = markdown.replace(/\$\$([\s\S]+?)\$\$/g, function (_, latex) {
        return '<div class="math-display">\\[' + escapeLatexForHtml(latex.trim()) + '\\]</div>';
      });

      return protectedBlocks.replace(/(^|[^\\])\$((?:\\.|[^$\\\n])+?)\$/g, function (_, prefix, latex) {
        return prefix + '<span class="math-inline">&#92;(' + escapeLatexForHtml(latex) + '&#92;)</span>';
      });
    }

    function placeVisitorMap(attempt) {
      const visitorMap = document.getElementById('visitor-map');
      const content = document.querySelector('.markdown-section');

      if (!visitorMap || !content) {
        if (attempt < 100) window.setTimeout(() => placeVisitorMap(attempt + 1), 50);
        return;
      }

      const hash = window.location.hash;
      const isHomeRoute = !hash || hash === '#/' || hash.startsWith('#/?');

      if (isHomeRoute) {
        visitorMap.hidden = false;
        content.appendChild(visitorMap);
      } else {
        visitorMap.hidden = true;
        document.body.appendChild(visitorMap);
      }
    }

    function preserveVisitorMap() {
      const visitorMap = document.getElementById('visitor-map');
      if (visitorMap && visitorMap.parentElement !== document.body) {
        document.body.appendChild(visitorMap);
      }
    }

    function renderAttentionReadCount() {
      const counter = document.getElementById('attention-read-counter');
      const value = document.getElementById('attention-read-count');

      if (!counter || !value) return;

      const isPublishedSite = window.location.hostname === 'cymichael.github.io'
        || window.location.hostname === 'www.cymichael.github.io';

      if (!isPublishedSite) {
        counter.hidden = true;
        return;
      }

      counter.hidden = false;
      value.textContent = 'Loading';

      fetch('https://countapi.mileshilliard.com/api/v1/hit/cymichael-github-io-attention-reads-v1')
        .then(function (response) {
          if (!response.ok) throw new Error('Read counter request failed');
          return response.json();
        })
        .then(function (data) {
          if (typeof data.value !== 'number') throw new Error('Invalid read counter response');
          value.textContent = new Intl.NumberFormat().format(data.value);
        })
        .catch(function () {
          counter.hidden = true;
        });
    }

    window.$docsify = {
      name: "Yi Cui",
      repo: '',
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 3,
      search: {
        placeholder: 'Type to search',
        noData: 'No matches found.',
        depth: 2,
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown) {
            preserveVisitorMap();
            return protectDocsifyMath(markdown);
          });

          hook.doneEach(function () {
            window.setTimeout(() => {
              renderDocsifyMath(0);
              placeVisitorMap(0);
              renderAttentionReadCount();
            }, 0);
          });
        }
      ]
    };
  </script>

  <!-- MathJax is loaded before Docsify. The custom hook typesets each rendered route. -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Recommended Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>

  <section id="visitor-map" class="visitor-map" hidden aria-label="Visitor map">
    <h2>Visitor Map</h2>
    <div class="visitor-map-widget">
      <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=EwPtc4H4PAsP3Mb4tT-WXPNOsqI2P-hTaLKuIk8YL3o&cl=ffffff&w=a"></script>
    </div>
  </section>
</body>
</html>
