<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <title>Yi Cui's Blog</title>
  <meta name="description" content="Technical notes and reading guides on machine learning.">

  <!-- Docsify blog theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #1f6f8b; --sidebar-width: 300px; }
    body, .sidebar { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .markdown-section { max-width: 800px; padding: 3.4rem 3.8rem 5rem; color: #263238; line-height: 1.75; }
    .markdown-section h1 { margin-top: 0; font-size: 2.25rem; letter-spacing: -0.03em; }
    .markdown-section h2 { margin-top: 2.8rem; border-bottom: 1px solid #dce3e6; padding-bottom: 0.35rem; }
    .markdown-section h3 { margin-top: 2rem; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section mjx-container[display="true"] { margin: 1.2rem 0 !important; }
    .markdown-section .math-display { max-width: 100%; overflow-x: auto; }
    .sidebar { border-right: 1px solid #e5eaec; }
    .sidebar-nav > ul > li > p { color: #526068; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    @media screen and (max-width: 768px) { .markdown-section { padding: 2.2rem 1.4rem 3.5rem; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.MathJax = {
      startup: {
        typeset: false
      },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };

    function renderDocsifyMath(attempt) {
      const content = document.querySelector('.markdown-section');
      const sidebar = document.querySelector('.sidebar');

      if (!content || !window.MathJax || !window.MathJax.typesetPromise) {
        if (attempt < 100) window.setTimeout(() => renderDocsifyMath(attempt + 1), 50);
        return;
      }

      const elements = [content, sidebar].filter(Boolean);
      window.MathJax.typesetClear(elements);
      window.MathJax.typesetPromise(elements).catch((error) => console.error('Math rendering failed:', error));
    }

    function escapeLatexForHtml(latex) {
      return latex
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function protectDocsifyMath(markdown) {
      const protectedBlocks = markdown.replace(/\$\$([\s\S]+?)\$\$/g, function (_, latex) {
        return '<div class="math-display">\\[' + escapeLatexForHtml(latex.trim()) + '\\]</div>';
      });

      return protectedBlocks.replace(/(^|[^\\])\$((?:\\.|[^$\\\n])+?)\$/g, function (_, prefix, latex) {
        return prefix + '<span class="math-inline">&#92;(' + escapeLatexForHtml(latex) + '&#92;)</span>';
      });
    }

    window.$docsify = {
      name: "Yi Cui",
      repo: '',
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 3,
      search: {
        placeholder: 'Type to search',
        noData: 'No matches found.',
        depth: 2,
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown) {
            return protectDocsifyMath(markdown);
          });

          hook.doneEach(function () {
            window.setTimeout(() => renderDocsifyMath(0), 0);
          });
        }
      ]
    };
  </script>

  <!-- MathJax is loaded before Docsify. The custom hook typesets each rendered route. -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Recommended Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  
</body>
</html>
