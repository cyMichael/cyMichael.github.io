<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <title>Yi Cui | Economics, Statistics, and Machine Learning</title>
  <meta name="description" content="Yi Cui — research in economics, statistics, causal inference, and machine learning.">

  <!-- Docsify academic profile theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #1f6f8b; --sidebar-width: 300px; }
    body, .sidebar { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .markdown-section { max-width: 800px; padding: 3.4rem 3.8rem 5rem; color: #263238; line-height: 1.75; }
    .markdown-section h1 { margin-top: 0; font-size: 2.25rem; letter-spacing: -0.03em; }
    .markdown-section h2 { margin-top: 2.8rem; border-bottom: 1px solid #dce3e6; padding-bottom: 0.35rem; }
    .markdown-section h3 { margin-top: 2rem; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section mjx-container[display="true"] { margin: 1.2rem 0 !important; }
    .sidebar { border-right: 1px solid #e5eaec; }
    .sidebar-nav > ul > li > p { color: #526068; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    @media screen and (max-width: 768px) { .markdown-section { padding: 2.2rem 1.4rem 3.5rem; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };

    window.$docsify = {
      name: "Yi Cui",
      repo: '',
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 3,
      search: {
        placeholder: 'Type to search',
        noData: 'No matches found.',
        depth: 2,
      },
      latex: {
        overflowScroll: true,
        customOptions: {
          chtml: {
            scale: 1.0
          },
        }
      }
    };
  </script>

  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Recommended Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  
  <!-- MathJax parses and displays the LaTeX used in technical posts. -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-latex@0"></script>
</body>
</html>
